name: Givemetap
description: GiveMeTap is a UK-based social-enterprise consumer brand that designs and sells reusable,
  BPA-free stainless-steel and insulated water bottles (500ml and 700ml, plus custom co-branded bottles
  for businesses). For every bottle sold, GiveMeTap funds five years of clean drinking water for a person
  in Ghana, giving 20% of its revenue to water projects in Africa; the company reports 116,391 people
  reached with clean water for life. It operates a direct-to-consumer e-commerce storefront on the Shopify
  platform. GiveMeTap is a physical-products company with no first-party developer API, developer portal,
  or public API documentation; it was surfaced as a Y Combinator portfolio lead and added to the API Evangelist
  network as a stub.
